<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>양진영 마케팅 포트폴리오</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="nav" aria-label="주요 메뉴">
      <a class="brand" href="#top">양진영</a>
      <div class="links">
        <a href="#projects">핵심 업무</a>
        <a href="#cases">주요 성과 사례</a>
      </div>
    </nav>
  </header>
  <main id="overview">
    <section class="hero" id="top">
      <div class="wrap">
        <h1>데이터와 크리에이티브를 <br><span>함께 다루는 마케터</span></h1>
        <p>브랜드의 핵심 메시지를 기획하고, 유관부서와 협업해 온·오프라인 캠페인으로 실행했습니다. 광고 예산과 캠페인 성과를 분석해 다음 운영에 반영했습니다.</p>
        <div class="hero-actions">
          <a class="button" href="#projects">핵심 업무</a>
          <a class="button button-outline" href="#cases">주요 성과 사례</a>
        </div>
      </div>
    </section>
    <section class="section alt" id="projects">
      <div class="wrap">
        <h2>핵심 업무</h2>
        <div class="cards" id="projectCards"></div>
      </div>
    </section>
    <section class="section" id="cases">
      <div class="wrap">
        <h2>주요 성과 사례</h2>
        <div class="cards" id="caseCards"></div>
        <div id="caseArticles"></div>
      </div>
    </section>
  </main>
  <script src="content.js"></script>
  <script src="script.js"></script>
  <script src="cases.js"></script>
  <script src="case-section.js"></script>
</body>
</html>
